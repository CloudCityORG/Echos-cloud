server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: service-chart
          uri: http://localhost:8081
          predicates:
            - Path=/chart/**
        - id: service-vote
          uri: http://localhost:8082
          predicates:
            - Path=/vote/**
        - id: service-audit
          uri: http://localhost:8083
          predicates:
            - Path=/audit/**
        - id: service-agent
          uri: http://localhost:8084
          predicates:
            - Path=/agent/**
        - id: service-user
          uri: http://localhost:8085
          predicates:
            - Path=/user/**
        - id: service-websocket
          uri: http://localhost:8086
          predicates:
            - Path=/ws/**