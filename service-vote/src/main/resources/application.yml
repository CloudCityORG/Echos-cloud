spring:
  application:
    name: service-vote
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mu_cloud_vote?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 280939
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  data:
    redis:
      host: localhost
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: a2f1df1d-29d7-4bfe-85f5-7beec09bd563
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      retries: 3
