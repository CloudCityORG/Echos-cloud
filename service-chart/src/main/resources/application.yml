spring:
  application:
    name: service-chart
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url:  jdbc:mysql://localhost:3306/mu_cloud_chart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 280939
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 100
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
  data:
    redis:
      host: localhost
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 10
          max-wait: 3000ms    # ← 新增：等连接最多等 3 秒
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: a2f1df1d-29d7-4bfe-85f5-7beec09bd563
  elasticsearch:
    uris: http://localhost:9210
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      retries: 3
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

kafka:
  topic:
    user-behavior: user-behavior

server:
  port: 8082
  tomcat:
    threads:
      max: 300              # ← 新增：100线程→稍微多给点余量
      min-spare: 20
    max-connections: 10000   # ← 新增
    accept-count: 200        # ← 新增

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    com.echos: debug