spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: a2f1df1d-29d7-4bfe-85f5-7beec09bd563
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: service-user
          uri: lb://service-user
          predicates:
            - Path=/api/user/**
        - id: service-chart
          uri: lb://service-chart
          predicates:
            - Path=/api/chart/**
        - id: service-agent
          uri: lb://service-agent
          predicates:
            - Path=/api/agent/**
        - id: service-audit
          uri: lb://service-audit
          predicates:
            - Path=/api/audit/**
        - id: service-vote
          uri: lb://service-vote
          predicates:
            - Path=/api/vote/**
        - id: service-websocket
          uri: lb://service-websocket
          predicates:
            - Path=/api/ws/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"

server:
  port: 8080

logging:
  level:
    com.echos: debug
    org.springframework.cloud.gateway: debug